
name: "💬 Auto Comment on Issue"

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  comment:
    name: Add Welcome Comment
    runs-on: ubuntu-latest

    steps:
      - name: Add Comment to Issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;

            const commentBody = `### 🎉 Thank you for raising this issue!

            We'll review it as soon as possible. We truly appreciate your contributions!

            > 📌 **Before creating a Pull Request:**
            >
            > - Make sure you have read the \`README.md\`.
            > - Review the \`CONTRIBUTING.md\` guidelines.
            > - Read the \`CODE_OF_CONDUCT.md\`.
            > - Please do not create a Pull Request until this issue has been assigned to you.

            Thank you for contributing to our project! ✨`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: commentBody
            });

            console.log(`Successfully added a welcome comment to issue #${issueNumber}.`);
